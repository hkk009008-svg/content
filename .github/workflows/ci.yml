# Landed per the 2026-05-24 handoff. Three independent verification jobs run
# in parallel; all must pass for the workflow to succeed. A fourth manual-only
# threeway signer job can emit ci_result after those jobs pass during go-live.
# Mirrors the three local checks documented in ARCHITECTURE.md §15 +
# OPERATIONS.md §7. Concurrency cancels older runs on the same branch (saves
# minutes on rapid pushes).
#
# 2026-06-10 (STRATEGIC_REVIEW-2026-06-10 P0-1 / NF-1): the pytest job was
# 0-for-289 since landing — bare `pytest` cannot import root modules
# (cost_tracker, …) at collection time. The fix lives in pyproject.toml
# ([tool.pytest.ini_options] pythonpath = ["."]), not in this file. Action
# majors bumped to Node-24 runtimes ahead of GitHub's 2026-06-16 forcing.
#
# 2026-08-01 (FIX-CI): the pytest-unit AND smoke jobs were nondeterministically
# SIGILL-crashing on `main` (6 of 8 sampled runs; exit 132, "Fatal Python
# error: Illegal instruction") — NOT a test regression. Root cause:
# audio/effects.py hard-imports Spotify's `pedalboard` package (by its own
# documented design — no graceful fallback); pedalboard's published Linux
# wheel bakes in `-march=native` from whichever GH Actions host built it,
# with NO runtime CPU dispatch (pedalboard's own CMakeLists.txt ~L203-216;
# open upstream issue github.com/spotify/pedalboard#454). On a runner host
# whose CPU lacks that exact instruction set, `from pedalboard_native
# import *` SIGILLs the whole interpreter before collection (pytest-unit)
# or the §15 checks (smoke) can run. PyPI ships wheels only — no sdist for
# any recent release — so we can't rebuild from source with a safe
# baseline, and no env var helps on the CONSUMING side (the bad ISA is
# baked into the binary at Spotify's build time, not selected at our
# runtime). Fix is containment, not an upstream fix, in two pieces:
#   - pytest-unit: tests/conftest.py probes the import in a disposable
#     child process (a SIGILL there can't take down pytest) and shims
#     sys.modules['pedalboard'] before any test module is collected, ONLY
#     when the probe shows the real import is fatal on this host.
#   - smoke: this job's own step below does the same probe and shims an
#     inert `pedalboard` package onto PYTHONPATH before invoking
#     scripts/ci_smoke.py (conftest.py's mechanism is pytest-only, so it
#     can't reach a bare `python scripts/ci_smoke.py` invocation).
# Both are complete no-ops on a healthy host — real pedalboard runs
# untouched there, exactly as before. Verified no test in tests/unit/
# exercises real pedalboard DSP (test_effects.py mocks
# apply_pedalboard_chain itself, or drives inputs that early-return before
# touching a real Pedalboard/Reverb/etc. object), so this changes no
# test's behavior, only removes the host-CPU crash. Downgrading the
# pedalboard version was considered and rejected: the crashing wheel
# (0.9.24) was byte-identical across every sampled crashing AND clean run —
# it's the runtime host that varies, not the wheel, so an older 0.9.x
# would carry the same unconditional -march=native baked in.
#
# Scope intentionally NOT included (per the 2026-05-24 Session 1 brief):
#   - Linting (ruff, eslint)
#   - Deployment workflows
#   - Auto-publish, releases, changelogs
#   - Code coverage reporting
#   - Matrix builds
#
# Baseline: the CURRENT suite count lives in ARCHITECTURE.md §16 (single
# source — these comments stopped tracking it after drifting twice in one
# day). Properties that hold: the live ubuntu runner shows a handful more
# skips than local macOS (environment-conditional self-skips; same total
# collected). First-green acceptance evidence: run 27267540679
# (2026-06-10, 1975 passed + 7 skipped) and the intentional-red proof on
# PR #12 run 27267553553.
#   - tsc --noEmit: silent exit
#   - §15 smoke: OK
#
# Security review (per .claude security_reminder_hook):
#   - No untrusted-input interpolation in `run:` blocks. The manual
#     threeway integration SHA is passed through an env var, validated as
#     a 40-char lowercase hex SHA, then shell-quoted before signing.
#   - Only `${{ github.workflow }}` + `${{ github.ref }}` in `concurrency:`
#     group key, which is the canonical GitHub pattern; ref is not used in
#     any shell command.
#   - No reference to github.event.*, github.head_ref, or commit messages.
#   - The 2026-08-01 pedalboard-stub heredoc (smoke job) is 100% static
#     text — no `${{ }}` GitHub-context expression is interpolated into it
#     or into any shell command in that step; the only runtime values used
#     are $RUNNER_TEMP (a GH-controlled path) and $PYTHONPATH (appended
#     to, never executed).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      integration_sha:
        description: Exact CAS-merged integration commit SHA to test and sign
        required: true
        type: string
      integration_ref:
        description: Fetchable branch, tag, or ref whose HEAD is integration_sha
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ARCHITECTURE.md §15 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.integration_ref || github.sha }}

      - name: Verify threeway integration checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
        run: |
          case "$INTEGRATION_SHA" in
            *[!0-9a-f]*|'')
              echo "integration_sha must be a lowercase 40-hex Git SHA" >&2
              exit 1
              ;;
          esac
          test "${#INTEGRATION_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      # DeepFace lazy-downloads GhostFaceNet weights (~700MB) on first
      # validator construction. Cache them across runs so first run is slow
      # but subsequent runs are fast.
      - name: Cache DeepFace weights
        uses: actions/cache@v5
        with:
          path: ~/.deepface
          key: deepface-weights-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run §15 singleton + ctx-plumbing invariants
        # Single source of truth: scripts/ci_smoke.py.
        # If invariants change, update that script + ARCHITECTURE.md §15's
        # prose list together — no other file inlines the smoke block.
        #
        # ci_smoke.py's main() does `import cinema_pipeline` (§15.2), which
        # transitively imports audio.music -> audio.effects -> pedalboard.
        # Spotify's published Linux wheel bakes in `-march=native` from
        # whichever GH Actions host built it, with no runtime CPU dispatch
        # (spotify/pedalboard CMakeLists.txt ~L203-216; upstream issue
        # github.com/spotify/pedalboard#454, open/unresolved) — so on a
        # runner host whose CPU lacks that exact instruction set, the import
        # SIGILLs the whole process before ci_smoke.py's own checks can run
        # (measured: 6 of 8 sampled `main` CI runs died this way, always on
        # the same pedalboard==0.9.24 — the runtime host varies, not the
        # wheel; PyPI ships wheels only, no sdist, so we can't rebuild from
        # source with a safe baseline either). Full reasoning + the
        # pytest-suite half of this same fix (which shims sys.modules
        # in-process instead, since a SIGILL can't be try/excepted):
        # tests/conftest.py.
        #
        # Probe the import in a disposable child process first — a SIGILL
        # there can't take down this step — and only shim an inert
        # `pedalboard` package onto PYTHONPATH when the real import is
        # actually fatal on this host. A no-op whenever the real import is
        # fine, so this never changes behavior on a healthy runner.
        run: |
          if ! python -c "import pedalboard" >/dev/null 2>&1; then
            echo "pedalboard's native extension SIGILLs on this host's CPU (known upstream issue spotify/pedalboard#454) -- using an inert stub for this run."
            python - "$RUNNER_TEMP/pedalboard_ci_stub/pedalboard" <<'PYEOF'
          import sys
          from pathlib import Path

          pkg_dir = Path(sys.argv[1])
          pkg_dir.mkdir(parents=True, exist_ok=True)

          init_py = '''class _Unusable:
              def __init__(self, *a, **k):
                  raise RuntimeError(
                      "pedalboard's native extension does not load on this CI "
                      "runner's CPU (upstream spotify/pedalboard#454) -- this is "
                      "a CI stub, not the real library."
                  )


          Pedalboard = Reverb = Compressor = Gain = Delay = _Unusable
          HighpassFilter = LowpassFilter = Chorus = Distortion = _Unusable


          def load_plugin(*a, **k):
              raise RuntimeError(
                  "pedalboard.load_plugin is unavailable on this CI stub "
                  "(native extension does not load on this host's CPU)."
              )
          '''

          io_py = '''class AudioFile:
              def __init__(self, *a, **k):
                  raise RuntimeError(
                      "pedalboard.io does not load on this CI runner's CPU "
                      "(upstream spotify/pedalboard#454) -- this is a CI stub."
                  )
          '''

          (pkg_dir / "__init__.py").write_text(init_py)
          (pkg_dir / "io.py").write_text(io_py)
          PYEOF
            export PYTHONPATH="$RUNNER_TEMP/pedalboard_ci_stub:$PYTHONPATH"
          fi
          python scripts/ci_smoke.py

  pytest-unit:
    name: pytest tests/unit/
    runs-on: ubuntu-latest
    # Offline invariant restored (was 15→40 while six tests made real network calls and
    # pushed the suite to ~27 min). Those tests — phase_c_video_aspect, ltx_native,
    # llmensemble_cost_uncounted, quality_max_multichar, project_persistence,
    # style_director — were mocking the wrong boundary; they now stub the one the code
    # actually crosses (safe_download / fal_client / urllib.urlopen / research_cinematography).
    # Verified fully offline: 2947 passed in ~2 min with ZERO outbound socket attempts.
    # Restored to 15 — ample margin over the ~2-min runtime (most of which is the
    # real-subprocess test_threeway_* git-CAS concurrency tests, not network).
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      # Inert placeholders remain for phase-C vision/identity characterization
      # tests that intentionally read key-present ambient settings. The
      # LLMEnsemble configured-client/timeout tests inject their own keys;
      # LLMEnsemble itself is safe to construct keyless and leaves unconfigured
      # clients as None. No test calls the network (offline suite, ~2 min).
      OPENAI_API_KEY: ci-dummy-not-a-real-key
      GEMINI_API_KEY: ci-dummy-not-a-real-key
      ANTHROPIC_API_KEY: ci-dummy-not-a-real-key
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.integration_ref || github.sha }}

      - name: Verify threeway integration checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
        run: |
          case "$INTEGRATION_SHA" in
            *[!0-9a-f]*|'')
              echo "integration_sha must be a lowercase 40-hex Git SHA" >&2
              exit 1
              ;;
          esac
          test "${#INTEGRATION_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cache DeepFace weights
        uses: actions/cache@v5
        with:
          path: ~/.deepface
          key: deepface-weights-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Node/npm in a Python job is deliberate, not cruft — do not delete.
      # tests/unit/test_product_surface_inventory.py shells out to
      # scripts/product_surface_frontend_inventory.mjs, which resolves
      # `typescript` through createRequire(../web/package.json) — i.e. from
      # web/node_modules, relative to the SCRIPT, not to --root. web/node_modules
      # is gitignored, so without these two steps the helper exits 2, main()
      # returns 1, and the 82 tests in that file that invoke it fail for a
      # missing dependency (the other 78 mock the helper and pass regardless,
      # which is why this read as suite noise rather than a disarmed gate).
      # Measured on run 30621088290 (main @ 8dde7576): 82 of the job's 104
      # failures were exactly this. That also silently disarmed
      # test_repository_artifact_is_current, the only gate proving the committed
      # docs/generated/product_surface_inventory.json matches the committed
      # source. Deliberately NOT a skipif guard: an honest skip would leave the
      # artifact-currency gate unenforced, which is the failure mode that let
      # the drift go unnoticed in the first place. Fail closed instead.
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps (TypeScript for the surface-inventory tests)
        working-directory: web
        run: npm ci

      - name: Run pytest tests/unit/
        # tests/integration/ requires real cloud credentials and must NOT run
        # in CI. Current count: ARCHITECTURE.md §16 (single source). The
        # live runner shows a few more skips than local — environment-
        # conditional self-skips, same total collected.
        # If your PR changes this count, the diff or the brief explains why.
        # Root-module importability comes from [tool.pytest.ini_options]
        # pythonpath in pyproject.toml — bare `pytest` here relies on it.
        run: pytest tests/unit/ --tb=short -q --cov=. --cov-report=xml --cov-report=term

      - name: Run executable Wave 1 pin gate
        # ADR-027: the wave gate executes inventory selectors via pytest --runxfail.
        # A red result here is an honest gate failure, not a status-column failure.
        run: |
          python -m pytest tests/unit/test_auto_approve_nangate_xfail.py --runxfail -q
          python scripts/wave_gate_check.py 1

      - name: Run no-ceremony detector
        run: python scripts/check_no_ceremony.py

  tsc:
    name: TypeScript --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.integration_ref || github.sha }}

      - name: Verify threeway integration checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
        run: |
          case "$INTEGRATION_SHA" in
            *[!0-9a-f]*|'')
              echo "integration_sha must be a lowercase 40-hex Git SHA" >&2
              exit 1
              ;;
          esac
          test "${#INTEGRATION_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$INTEGRATION_SHA"

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps
        working-directory: web
        run: npm ci

      - name: TypeScript noEmit check
        working-directory: web
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: web
        run: npm test

  threeway-ci-result:
    name: Emit threeway ci_result
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke, pytest-unit, tsc]
    if: github.event_name == 'workflow_dispatch' && vars.THREEWAY_BUS_LIVE == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      INTEGRATION_SHA: ${{ inputs.integration_sha }}
    steps:
      # Signing runs from trusted main after the integration SHA has passed all
      # test jobs above. The ci private key never runs candidate-controlled code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install signing dependencies
        run: pip install -r requirements.txt

      - name: Emit signed ci_result for tested integration SHA
        env:
          THREEWAY_KEYSTORE: ${{ runner.temp }}/threeway_keys
          CI_PRIVATE_KEY: ${{ secrets.THREEWAY_CI_KEY }}
        run: |
          case "$INTEGRATION_SHA" in
            *[!0-9a-f]*|'')
              echo "integration_sha must be a lowercase 40-hex Git SHA" >&2
              exit 1
              ;;
          esac
          test "${#INTEGRATION_SHA}" -eq 40
          mkdir -p "$THREEWAY_KEYSTORE"
          printf '%s\n' "$CI_PRIVATE_KEY" > "$THREEWAY_KEYSTORE/ci.ed25519"
          python scripts/sign_ci_result.py --integration-sha "$INTEGRATION_SHA" --result PASS --remote origin
