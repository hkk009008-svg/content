name: RunPod image contract

on:
  pull_request:
    paths:
      - 'deploy/runpod-comfyui/**'
      - 'pulid.json'
      - 'tests/unit/test_runpod_production_deployment.py'
      - '.github/workflows/runpod-image-security.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/runpod-comfyui/**'
      - 'pulid.json'
      - 'tests/unit/test_runpod_production_deployment.py'
      - '.github/workflows/runpod-image-security.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deployment-contract:
    name: Deployment contract and lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install focused test and lock tools
        run: python -m pip install 'aiohttp==3.14.3' 'pytest>=8,<10' 'uv==0.10.11'

      - name: Validate shell and Python entrypoints
        run: |
          bash -n deploy/runpod-comfyui/bin/entrypoint.sh
          bash -n deploy/runpod-comfyui/lock_requirements.sh
          bash -n scripts/setup_runpod.sh
          python -m compileall -q deploy/runpod-comfyui/bin

      - name: Validate production manifest and focused tests
        run: |
          python deploy/runpod-comfyui/bin/model_artifacts.py \
            --manifest deploy/runpod-comfyui/models.json \
            --validate-only
          python -m pytest tests/unit/test_runpod_production_deployment.py -q

      - name: Prove lock regeneration is byte-identical
        run: |
          ./deploy/runpod-comfyui/lock_requirements.sh
          git diff --exit-code -- deploy/runpod-comfyui/requirements.lock

  image-security:
    name: Build, SBOM, Grype, and Trivy
    needs: deployment-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build the amd64 candidate without publishing it
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/runpod-comfyui/Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          push: false
          tags: content-comfyui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: content-comfyui:ci
          format: cyclonedx-json
          output-file: content-comfyui.cdx.json
          artifact-name: content-comfyui-sbom
          upload-artifact-retention: 14
          syft-version: v1.50.0

      - name: Reject high or critical findings with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: content-comfyui:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table
          grype-version: v0.116.1

      # v0.35.0 is the protected immutable action release documented after
      # Aqua's 2026 incident; its default Trivy v0.69.3 is also pinned here.
      - name: Independently reject high or critical findings with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: content-comfyui:ci
          scan-type: image
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
          version: v0.69.3
          cache: 'false'
