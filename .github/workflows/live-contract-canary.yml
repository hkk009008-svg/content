name: Live contract canary
run-name: Live contract canary - ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select exactly one provider boundary; the default cannot spend
        required: true
        type: choice
        default: none
        options:
          - none
          - runway-act-two
          - runpod-pulid-production
          - runpod-liveportrait-performance
      approval:
        description: Type the exact approval phrase documented in docs/LIVE_CONTRACT_CANARY.md
        required: true
        type: string
        default: ''
      max_cost_usd:
        description: Finite cap for one fixed canary; default zero is refused
        required: true
        type: string
        default: '0'

# Never cancel a worker after a provider may have accepted a paid task.
concurrency:
  group: live-contract-canary-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Validate explicit authorization without secrets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LIVE_CONTRACT_CANARY_TARGET: ${{ inputs.target }}
      LIVE_CONTRACT_CANARY_APPROVAL: ${{ inputs.approval }}
      LIVE_CONTRACT_CANARY_MAX_COST_USD: ${{ inputs.max_cost_usd }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Refuse defaults, ambiguous targets, and unsafe cost caps
        run: python scripts/live_contract_canary.py check-inputs

  live-canary:
    name: Run one protected live boundary
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: live-contract-canary
    env:
      LIVE_CONTRACT_CANARY_TARGET: ${{ inputs.target }}
      LIVE_CONTRACT_CANARY_APPROVAL: ${{ inputs.approval }}
      LIVE_CONTRACT_CANARY_MAX_COST_USD: ${{ inputs.max_cost_usd }}
      RUNWAYML_API_SECRET: ${{ inputs.target == 'runway-act-two' && secrets.RUNWAYML_API_SECRET || '' }}
      COMFYUI_SERVER_URL: ${{ inputs.target == 'runpod-pulid-production' && secrets.COMFYUI_SERVER_URL || '' }}
      COMFYUI_API_KEY: ${{ inputs.target == 'runpod-pulid-production' && secrets.COMFYUI_API_KEY || '' }}
      PERFORMANCE_COMFYUI_SERVER_URL: ${{ inputs.target == 'runpod-liveportrait-performance' && secrets.PERFORMANCE_COMFYUI_SERVER_URL || '' }}
      PERFORMANCE_COMFYUI_API_KEY: ${{ inputs.target == 'runpod-liveportrait-performance' && secrets.PERFORMANCE_COMFYUI_API_KEY || '' }}
      LIVE_CONTRACT_CANARY_LEDGER_PATH: ${{ runner.temp }}/live-contract-canary/runway-act-two.sqlite3
      LIVE_CONTRACT_CANARY_FIXTURE_DIR: ${{ github.workspace }}/.live-contract-canary-fixture
      CANARY_AUTHORITY_GITHUB_TOKEN: ${{ github.token }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Revalidate protected secrets without logging values
        run: python scripts/live_contract_canary.py check-ready

      - name: Restore durable Runway attempt ownership
        if: inputs.target == 'runway-act-two'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/live-contract-canary
          key: runway-act-two-ledger-v3-97471b93-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            runway-act-two-ledger-v3-97471b93-

      - name: Install video fixture tooling
        if: inputs.target == 'runway-act-two' || inputs.target == 'runpod-liveportrait-performance'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Install bounded canary dependencies
        run: >-
          python -m pip install
          'pytest>=8,<9'
          'Pillow>=11'
          'python-dotenv>=1,<2'
          'requests>=2.32.3,<3'
          'runwayml==4.14.0'

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Probe authenticated RunPod readiness without generation
        run: python scripts/live_contract_canary.py probe-runpod

      - name: Re-read Runway authority for this exact job attempt
        run: python scripts/live_contract_canary.py verify-runway-fence

      - name: Run exactly one selected live contract
        run: python scripts/live_contract_canary.py run

      - name: Save durable Runway attempt ownership
        if: always() && inputs.target == 'runway-act-two'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/live-contract-canary
          key: runway-act-two-ledger-v3-97471b93-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Retain the Runway attempt ledger
        if: always() && inputs.target == 'runway-act-two'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runway-act-two-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-contract-canary/
          if-no-files-found: warn
          retention-days: 30
