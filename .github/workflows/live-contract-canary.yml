name: Live contract canary
run-name: Live contract canary - ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select exactly one provider boundary; the default cannot spend
        required: true
        type: choice
        default: none
        options:
          - none
          - runway-act-two
          - runpod-pulid-production
          - runpod-liveportrait-performance
      approval:
        description: Type the exact approval phrase documented in docs/LIVE_CONTRACT_CANARY.md
        required: true
        type: string
        default: ''
      max_cost_usd:
        description: Finite cap for one fixed canary; default zero is refused
        required: true
        type: string
        default: '0'

# Never cancel a worker after a provider may have accepted a paid task.
concurrency:
  group: live-contract-canary-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Validate explicit authorization without secrets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LIVE_CONTRACT_CANARY_TARGET: ${{ inputs.target }}
      LIVE_CONTRACT_CANARY_APPROVAL: ${{ inputs.approval }}
      LIVE_CONTRACT_CANARY_MAX_COST_USD: ${{ inputs.max_cost_usd }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Refuse defaults, ambiguous targets, and unsafe cost caps
        run: python scripts/live_contract_canary.py check-inputs

  live-canary:
    name: Run one protected live boundary
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: live-contract-canary
    env:
      LIVE_CONTRACT_CANARY_TARGET: ${{ inputs.target }}
      LIVE_CONTRACT_CANARY_APPROVAL: ${{ inputs.approval }}
      LIVE_CONTRACT_CANARY_MAX_COST_USD: ${{ inputs.max_cost_usd }}
      RUNWAYML_API_SECRET: ${{ inputs.target == 'runway-act-two' && secrets.RUNWAYML_API_SECRET || '' }}
      COMFYUI_SERVER_URL: ${{ inputs.target == 'runpod-pulid-production' && secrets.COMFYUI_SERVER_URL || '' }}
      COMFYUI_API_KEY: ${{ inputs.target == 'runpod-pulid-production' && secrets.COMFYUI_API_KEY || '' }}
      PERFORMANCE_COMFYUI_SERVER_URL: ${{ inputs.target == 'runpod-liveportrait-performance' && secrets.PERFORMANCE_COMFYUI_SERVER_URL || '' }}
      PERFORMANCE_COMFYUI_API_KEY: ${{ inputs.target == 'runpod-liveportrait-performance' && secrets.PERFORMANCE_COMFYUI_API_KEY || '' }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Revalidate protected secrets without logging values
        run: python scripts/live_contract_canary.py check-ready

      - name: Install bounded canary dependencies
        run: >-
          python -m pip install
          'pytest>=8,<9'
          'Pillow>=11'
          'python-dotenv>=1,<2'
          'requests>=2.32.3,<3'
          'runwayml>=4'

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Probe authenticated RunPod readiness without generation
        run: python scripts/live_contract_canary.py probe-runpod

      - name: Run exactly one selected live contract
        run: python scripts/live_contract_canary.py run
