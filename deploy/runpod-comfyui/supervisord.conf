[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/content/supervisord.pid
childlogdir=/workspace/comfyui/logs

[program:comfyui]
command=/opt/content-venv/bin/python /opt/content/deployment/bin/supervised_comfyui.py
directory=/opt/comfyui
environment=COMFYUI_API_KEY=""
priority=10
autostart=true
autorestart=false
startsecs=1
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gateway]
command=/opt/content-venv/bin/python /opt/content/deployment/bin/gateway.py --listen 0.0.0.0 --port 8189 --upstream http://127.0.0.1:8188
directory=/opt/content/deployment
priority=20
autostart=true
autorestart=unexpected
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[eventlistener:comfyui_exit]
command=/opt/content-venv/bin/python /opt/content/deployment/bin/supervisor_events.py
environment=COMFYUI_API_KEY=""
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
buffer_size=10
priority=1
autostart=true
autorestart=unexpected
stdout_logfile=/dev/null
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
