evidence_tests = ["tests/unit/test_xfade_transitions.py", "tests/unit/test_guided_pipeline.py"]
exposure = "ui"
spend_kind = "compute_local"
note = "Cycle-17 MVP (9e75373/cc8dec6). Default-off flag `scene_transitions`; when on, _assemble_final routes per-scene concat through xfade_concat, else byte-identical hard-cut."

