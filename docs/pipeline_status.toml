# pipeline_status.toml — living pipeline-capability manifest (state-view Increment 2)
#
# The verifier-validated, drift-proof replacement for the static
# "implemented-but-unutilized catalog" (§10 of the comprehensive-test brief).
#
# Each [[component]] declares a capability + its current utilization status +
# a code anchor. The anchor is `file:SYMBOL` (NOT file:line) on purpose: symbol
# names survive line shifts, so this manifest does NOT drift when unrelated code
# moves. `scripts/check_doc_claims.py` (check_manifest) validates every anchor —
# if the named symbol no longer exists, the claim is flagged (a stale "X → symbol"
# claim can't survive silently). `scripts/status.py` renders this grouped by status.
#
# status enum:
#   live    — always runs in the default production path
#   wired   — reachable/works when its flag/condition is on (opt-in)
#   stubbed — code exists but is never effectively reached (dead toggle, no-op
#             return, zero callers) — a candidate to wire
#   parked  — implemented but blocked on external state (e.g. worker/node install)
#   inactive — deliberately unavailable by policy
#   dead    — confirmed dead; removal candidate
#
# Adding an entry: pick a stable `def`/`class`/module-const SYMBOL as the anchor
# and run `.venv/bin/python scripts/check_doc_claims.py` (or status.py) to confirm
# it resolves. Grows over time; v1 is a verified starter, not exhaustive.
#
# Evidence-backed fields (Slice 12, cinema/capability_manifest.py) — a `status`
# of `live`/`wired` is a CLAIM; `cinema.capability_manifest.validate_manifest`
# mechanically rejects the claim (forces `engaged_static = False`, with a
# human reason) unless BOTH of the following resolve to real code/tests:
#   consumer       — `file:SYMBOL` of the real production call site that
#                     invokes the `anchor` (producer). Empty for components
#                     that never claim engagement (stubbed/parked/inactive/dead).
#   evidence_tests — array of test paths (optionally `path::test_symbol`) that
#                     prove the capability. Empty for the same non-engaging set.
# Two more fields are informational (not consumer/test-gated) but kept as
# separate, never-collapsed facts per the product invariant "do not collapse
# independent truths":
#   exposure    — how an operator reaches this: "ui" | "api" | "internal"
#   spend_kind  — cost profile if invoked: "none" | "compute_local" |
#                 "paid_api" | "local_gpu"
# `runtime_credential` (optional) names a comma-separated env var (or vars)
# whose PRESENCE (never value) gates RUNTIME availability independently of
# `engaged_static` — see cinema/capability_manifest.py:_runtime_state.

